<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n0n_etre — photos</title>
  <link rel="icon" type="image/png" href="favicon_n0.png">

  <!-- Google Fonts: Michroma (titles), Archivo (menu, semibold), Archivo Black (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Archivo+Black&family=Archivo:ital,wght@0,400;0,600;1,400&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-wrap">

    <header>
      <div class="logo"><a href="index.html">n0n_etre</a></div>
      <nav>
        <ul>
          <li><a href="photos.html" class="active">photos</a></li>
          <li><a href="films.html">films</a></li>
          <li><a href="livres.html">livres</a></li>
        </ul>
      </nav>
    </header>

    <section class="section-header">
      <h1>Photos</h1>
      <div class="section-line"></div>
      <div class="section-link">
        <a href="commissions.html">voir les commissions</a>
      </div>
    </section>

    <section class="gallery">
      <!-- Replace src values with your own images.
           Group images of similar orientation into the same row:
           landscape-row = wide/horizontal images, portrait-row = tall/vertical images.
           Reorder which images go in which row to match your actual photos. -->

      <div class="gallery-row landscape-row">
        <img src="images/siren.jpg" alt="">
        <img src="images/siren5.jpg" alt="">
      </div>

      <div class="gallery-row portrait-row">
        <img src="images/sirenA.webp" alt="">
        <img src="images/ice.png" alt="">
        <img src="images/iice.png" alt="">
      </div>

      <div class="gallery-row portrait-row">
        <img src="images/mirror.jpg" alt="">
        <img src="images/sunsetsword.webp" alt="">
        <img src="images/nino.jpg" alt="">
      </div>

      <div class="gallery-row landscape-row">
        <img src="images/rock.jpg" alt="">
        <img src="images/red.jpg" alt="">
      </div>
      
    </section>

  </div>

  <!-- ---- Lightbox overlay ---- -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="">
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Next image">&#8250;</button>
  </div>

  <footer>
    <div class="footer-line"></div>
    <div class="footer-content">
      <p>n0netre 2026</p>
      <p>Montreal, Canada</p>
    </div>
  </footer>
  <script>
    const galleryImages = Array.from(document.querySelectorAll(".gallery img"));
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const closeBtn = document.getElementById("lightboxClose");
    const prevBtn = document.getElementById("lightboxPrev");
    const nextBtn = document.getElementById("lightboxNext");

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      lightboxImage.src = galleryImages[currentIndex].src;
      lightboxImage.alt = galleryImages[currentIndex].alt;
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden"; // prevent background scroll
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      document.body.style.overflow = "";
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % galleryImages.length;
      lightboxImage.src = galleryImages[currentIndex].src;
      lightboxImage.alt = galleryImages[currentIndex].alt;
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      lightboxImage.src = galleryImages[currentIndex].src;
      lightboxImage.alt = galleryImages[currentIndex].alt;
    }

    galleryImages.forEach((img, index) => {
      img.addEventListener("click", () => openLightbox(index));
      img.style.cursor = "pointer";
    });

    closeBtn.addEventListener("click", closeLightbox);
    nextBtn.addEventListener("click", showNext);
    prevBtn.addEventListener("click", showPrev);

    // Click outside the image (on the dark background) also closes it
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Keyboard support: Escape to close, arrow keys to navigate
    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") showNext();
      if (e.key === "ArrowLeft") showPrev();
    });
  </script>

</body>
</html>
