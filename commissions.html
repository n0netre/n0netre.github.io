<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n0netre — commissions</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Fonts: Michroma (titles), Archivo (menu semibold + body regular), Archivo Black (names) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Archivo+Black&family=Archivo:ital,wght@0,400;0,600;1,400&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-wrap">

    <header>
      <div class="logo"><a href="index.html">n0netre</a></div>
      <nav>
        <ul>
          <li><a href="apropos.html">à propos</a></li>
          <li><a href="photos.html" class="active">photos</a></li>
          <li><a href="films.html">films</a></li>
          <li><a href="livres.html">livres</a></li>
        </ul>
      </nav>
    </header>

    <section class="section-header">
      <h1>Commissions</h1>
      <div class="section-line"></div>
    </section>

    <section class="commissions-layout">

      <!-- ---- Left column: list of names ---- -->
      <div class="commissions-list">

        <button class="commission-item is-active" data-gallery="dana-chow">
          <h3>Dana Chow</h3>
          <p>Fashion design NÜ GUI</p>
        </button>

        <button class="commission-item" data-gallery="xela-eius">
          <h3>XELA EDNA &amp; EIUS ECHO</h3>
          <p>Pochettes de singles et photos de presse pour la sortie
            des titres <em>Ozone</em> et <em>Pas très perspicace</em>
            du duo musical Xela Edna et Eius Echo.</p>
        </button>

        <button class="commission-item" data-gallery="phobocosm">
          <h3>Phobocosm</h3>
          <p>Photos de presse du groupe de metal <em>Phobocosm</em>.</p>
        </button>

        <button class="commission-item" data-gallery="juliette-langevin">
          <h3>Juliette Langevin</h3>
          <p>Photos promotionnelles pour le recueil de poèmes
            <em>Fille méchante</em> de l'artiste et écrivaine Juliette Langevin.</p>
        </button>

        <button class="commission-item" data-gallery="orane-thibaud">
          <h3>Orane Thibaud</h3>
          <p>Photos promotionnelles pour le recueil de poèmes
            <em>Toute raison de m'aimer est forcément bonne</em> de l'artiste
            et écrivaine Orane Thibaud, alias Greta Ziegenhagen.</p>
        </button>

      </div>

      <!-- ---- Right column: carousel ---- -->
      <div class="commissions-carousel">
        <div class="carousel-viewport">
          <button class="carousel-arrow prev" aria-label="Previous image">&#8249;</button>
          <img id="carousel-image" src="" alt="">
          <button class="carousel-arrow next" aria-label="Next image">&#8250;</button>
        </div>
      </div>

    </section>

  </div>

  <footer>
    <div class="footer-line"></div>
    <div class="footer-content">
      <p>n0netre 2026</p>
      <p>n0netre@hotmail.com<p>
      <p>Montreal, Canada</p>
    </div>
  </footer>

  <!-- ---- Lightbox overlay ---- -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
  <img class="lightbox-image" id="lightboxImage" src="" alt="">
  <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Next image">&#8250;</button>
</div>

  <script>
    // Map each name's data-gallery key to its list of images.
    // Replace these paths with your own image files.
    const galleries = {
      "dana-chow": [
        "images/dana.webp",
        "images/dana2.webp",
        "images/dana3.webp",
        "images/Dana4.webp"
      ],
      "xela-eius": [
        "images/Xela1.webp",
        "images/Xela2.webp",
        "images/Xela3.webp",
        "images/Xela4.webp",
        "images/XelaA.webp",
        "images/XelaB.webp",
        "images/XelaC.webp",
      ],
      "phobocosm": [
        "images/phb.webp",
        "images/phb2.webp",
        "images/phb3.webp"
      ],
      "juliette-langevin": [
        "images/Gina1.webp",
        "images/Gina2.webp",
        "images/Gina3.webp"
      ],
      "orane-thibaud": [
        "images/greta-farm.webp",
        "images/grate-farm2.webp"
      ]
    };

    const items = document.querySelectorAll(".commission-item");
    const image = document.getElementById("carousel-image");
    const carousel = document.querySelector(".commissions-carousel");
    const prevBtn = document.querySelector(".carousel-arrow.prev");
    const nextBtn = document.querySelector(".carousel-arrow.next");

    let currentGallery = "dana-chow";
    let currentIndex = 0;

    function showImage() {
      if (!currentGallery) return;
      const list = galleries[currentGallery];
      if (!list || list.length === 0) return;
      image.src = list[currentIndex];
      image.alt = currentGallery + " — image " + (currentIndex + 1);
    }

    function setActiveItem(button) {
      items.forEach(el => el.classList.remove("is-active"));
      button.classList.add("is-active");
    }

    items.forEach(button => {
      button.addEventListener("click", () => {
        currentGallery = button.dataset.gallery;
        currentIndex = 0;
        setActiveItem(button);
        carousel.classList.add("is-visible");
        showImage();
      });
    });

    prevBtn.addEventListener("click", () => {
      if (!currentGallery) return;
      const list = galleries[currentGallery];
      currentIndex = (currentIndex - 1 + list.length) % list.length;
      showImage();
    });

    nextBtn.addEventListener("click", () => {
      if (!currentGallery) return;
      const list = galleries[currentGallery];
      currentIndex = (currentIndex + 1) % list.length;
      showImage();
    });

// ---- Lightbox ----
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

function updateLightbox() {
  lightboxImage.src = galleries[currentGallery][currentIndex];
  lightboxImage.alt = image.alt;
}

function openLightbox() {
  updateLightbox();
  lightbox.classList.add("is-open");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.classList.remove("is-open");
  document.body.style.overflow = "";
}

function stepLightbox(direction) {
  const list = galleries[currentGallery];
  currentIndex = (currentIndex + direction + list.length) % list.length;
  showImage();      // keeps the carousel behind in sync
  updateLightbox();
}

image.style.cursor = "pointer";
image.addEventListener("click", openLightbox);

document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightboxPrev").addEventListener("click", () => stepLightbox(-1));
document.getElementById("lightboxNext").addEventListener("click", () => stepLightbox(1));

// Clicking the dark background also closes it
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) closeLightbox();
});

// Keyboard: Escape closes, left/right arrows navigate
document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("is-open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") stepLightbox(1);
  if (e.key === "ArrowLeft") stepLightbox(-1);
});

// Show the first gallery (Dana Chow) on page load
carousel.classList.add("is-visible");
showImage();
  </script>

</body>
</html>
